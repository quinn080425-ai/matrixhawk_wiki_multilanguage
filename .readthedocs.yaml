version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# ⬇️⬇️⬇️ 【新增核心配置】 ⬇️⬇️⬇️
# 必须显式告诉 RTD 去拉取子模块，否则子项目文件夹是空的！
submodules:
  include: all
  recursive: true
# ⬆️⬆️⬆️ ------------------- ⬆️⬆️⬆️

sphinx:
  configuration: ardupilot/source/conf.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: requirements.txt